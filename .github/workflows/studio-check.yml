name: Studio security checks
on:
  pull_request:
    branches: [modern-site]
  push:
    branches: [modern-site]
permissions:
  contents: read
jobs:
  studio-check:
    name: Studio checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _studio/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:all
      - name: Verify published Studio assets match source
        run: |
          git diff --exit-code -- ../studio
          test -z "$(git ls-files --others --exclude-standard ../studio)"
