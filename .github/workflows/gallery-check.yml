name: Gallery validation
on:
  pull_request:
    branches: [modern-site]
  push:
    branches: [modern-site]
permissions:
  contents: read
jobs:
  gallery:
    name: Gallery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s _checks -p 'test_*.py'
      - run: python3 _checks/gallery.py
