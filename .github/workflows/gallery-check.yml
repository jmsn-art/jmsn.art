name: Gallery validation
on:
  pull_request:
    branches: [modern-site]
  push:
    branches: [modern-site]
permissions:
  contents: read
jobs:
  gallery:
    name: Gallery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s _checks -p 'test_*.py'
      - run: python3 _checks/gallery.py
