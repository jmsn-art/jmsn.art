<!DOCTYPE html>
<html lang="en-US">
<head>
  <script src="/oaiq-init.js"></script>
  <meta name="description" content="The page you requested is not available. Return to The Art Circle Project by Jameson McShane.">
  <meta property="og:title" content="404 — The Art Circle Project">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — The Art Circle Project</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    :root{
      --bg:#0b0b0a;--fg:#f3f0e8;--muted:#aaa69d;--accent:#d3ad48;
      --line:rgba(255,255,255,.12);--max:1480px;--pad:clamp(18px,3.2vw,56px);
      color-scheme:dark light
    }
    .light-mode{
      --bg:#f4f1e9;--fg:#121210;--muted:#68645d;--accent:#9a741d;
      --line:rgba(0,0,0,.14);color-scheme:light
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;
      -webkit-font-smoothing:antialiased;transition:background 1s ease,color 1s ease
    }
    a{color:inherit}
    ::selection{background:var(--accent);color:#111}

    .masthead{
      width:min(calc(100% - (var(--pad)*2)),var(--max));margin:0 auto;min-height:92px;
      display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;border-bottom:1px solid var(--line)
    }
    .brand{text-decoration:none;display:flex;align-items:baseline;gap:12px}
    .brand-name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(19px,1.8vw,28px);letter-spacing:-.025em}
    .brand-by{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
    #toggleTheme{background:none;border:1px solid var(--line);color:var(--fg);padding:.55em .75em;cursor:pointer}

    main{
      width:min(calc(100% - (var(--pad)*2)),var(--max));margin:0 auto;
      min-height:calc(100vh - 93px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);
      gap:clamp(45px,8vw,140px);align-items:center;padding:clamp(65px,8vw,120px) 0
    }
    .code{
      margin:0;color:var(--accent);font-size:10px;letter-spacing:.22em;text-transform:uppercase
    }
    h1{
      margin:18px 0 0;font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(66px,10vw,164px);font-weight:400;line-height:.82;letter-spacing:-.075em
    }
    h1 em{color:var(--accent);font-weight:400}
    .copy{
      margin:32px 0 0;max-width:560px;color:var(--muted);font-size:14px;line-height:1.8
    }
    .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
    .links a{
      display:inline-block;padding:14px 18px;border:1px solid var(--line);text-decoration:none;
      font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase
    }
    .links a:first-child{background:var(--fg);border-color:var(--fg);color:var(--bg)}
    .links a:hover{background:var(--accent);border-color:var(--accent);color:#111}

    .circle-wrap{display:grid;place-items:center;min-height:460px}
    .broken-circle{
      width:min(34vw,430px);aspect-ratio:1;border-radius:50%;
      border:clamp(22px,3vw,46px) solid var(--accent);
      position:relative;transform:rotate(-18deg);
      filter:drop-shadow(0 22px 45px rgba(0,0,0,.18))
    }
    .broken-circle::after{
      content:"";position:absolute;right:-18%;top:8%;width:42%;height:32%;
      background:var(--bg);transform:rotate(18deg);
      transition:background 1s ease
    }
    .broken-circle::before{
      content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid var(--line)
    }

    footer{
      position:fixed;left:var(--pad);right:var(--pad);bottom:22px;
      color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
      pointer-events:none
    }

    @media(max-width:850px){
      .masthead{padding:22px 0}
      main{grid-template-columns:1fr;align-content:center}
      .circle-wrap{order:-1;min-height:260px}
      .broken-circle{width:min(60vw,290px);border-width:28px}
      footer{position:static;width:min(calc(100% - (var(--pad)*2)),var(--max));margin:0 auto;padding:0 0 25px}
    }
    @media(max-width:520px){.brand-by{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="The Art Circle Project home">
      <span class="brand-name">The Art Circle Project</span>
      <span class="brand-by">Jameson McShane</span>
    </a>
    <button id="toggleTheme" type="button" aria-label="Toggle light/dark mode" aria-pressed="false">☀️ / 🌙</button>
  </header>

  <main>
    <section>
      <p class="code">Error 404 · incomplete</p>
      <h1>The circle<br>is <em>broken.</em></h1>
      <p class="copy">The page you were looking for isn't here. The gap, at least, is intentional.</p>
      <nav class="links" aria-label="404 navigation">
        <a href="/">Return to gallery</a>
        <a href="/about.html">About the project</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </section>

    <div class="circle-wrap" aria-hidden="true">
      <div class="broken-circle"></div>
    </div>
  </main>

  <footer>© <span id="y"></span> Jameson McShane · The Art Circle Project</footer>

  <script>
    document.getElementById('y').textContent=new Date().getFullYear();
    const btn=document.getElementById('toggleTheme');
    let saved=null;
    try{saved=localStorage.getItem('theme')}catch(e){}
    const initial=saved || (window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
    if(initial==='light'){
      document.body.classList.add('light-mode');
      btn.setAttribute('aria-pressed','true');
    }
    btn.addEventListener('click',()=>{
      const light=document.body.classList.toggle('light-mode');
      btn.setAttribute('aria-pressed',String(light));
      try{localStorage.setItem('theme',light?'light':'dark')}catch(e){}
    });
  </script>
</body>
</html>
