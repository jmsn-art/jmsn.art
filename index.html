  // --- GA helper: safely emit custom or GA4-recommended events ---
  function sendGA(eventName, params) {
    try { if (typeof gtag === 'function') { gtag('event', eventName, params || {}); } } catch (e) {}
  }

  // Safe localStorage wrapper
  const storage = {
    get: (key) => {
      try { return localStorage.getItem(key); } catch(e) { return null; }
    },
    set: (key, val) => {
      try { localStorage.setItem(key, val); } catch(e) {}
    }
  };

  // --- Theme: apply saved or system preference ---
  (function initTheme(){
    const btn = document.getElementById('toggleTheme');
    const saved = storage.get('theme');
    const preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    function apply(mode){
      if (mode === 'light') { document.body.classList.add('light-mode'); btn.setAttribute('aria-pressed','true'); }
      else { document.body.classList.remove('light-mode'); btn.setAttribute('aria-pressed','false'); }
    }
    apply(saved ? saved : (preferLight ? 'light' : 'dark'));
    btn.addEventListener('click', ()=>{
      const isLight = document.body.classList.toggle('light-mode');
      btn.setAttribute('aria-pressed', String(isLight));
      storage.set('theme', isLight ? 'light' : 'dark');
      sendGA('theme_toggle', { mode: isLight ? 'light' : 'dark' });
    });
  })();

  // --- Gallery / Lightbox ---
  document.addEventListener('DOMContentLoaded', () => {
    const gallery = document.getElementById('gallery');
    const lb = document.getElementById('lb');
    const lbimg = document.getElementById('lbimg');
    const closeBtn = document.getElementById('lightboxClose');
    const lbTitle = document.getElementById('lb-title');
    const touchHint = document.getElementById('touchHint');
    const announcer = document.getElementById('a11yAnnouncer');

    let totalImages = 0;
    let hasShownTouchHint = storage.get('touchHintShown') === 'true';

    // --- Zoom + Pan state for lightbox image ---
    let scale = 1, tx = 0, ty = 0;
    let dragging = false, startX = 0, startY = 0, activePointerId = null;
    let lastZoomLevel = 1;

    function applyTransform() {
      lbimg.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1; tx = 0; ty = 0;
      lbimg.classList.remove('zoomed');
      applyTransform();
      lastZoomLevel = 1;
    }

    function clampPan() {
      const rect = lbimg.getBoundingClientRect();
      const maxX = ((rect.width  * scale) - rect.width ) / 2;
      const maxY = ((rect.height * scale) - rect.height) / 2;
      tx = maxX > 0 ? Math.max(-maxX, Math.min(maxX, tx)) : 0;
      ty = maxY > 0 ? Math.max(-maxY, Math.min(maxY, ty)) : 0;
    }

    function zoomAt(clientX, clientY, newScale) {
      const rect = lbimg.getBoundingClientRect();
      const cx = clientX - (rect.left + rect.width  / 2);
      const cy = clientY - (rect.top  + rect.height / 2);
      const k = newScale / scale;
      tx = tx - cx * (k - 1);
      ty = ty - cy * (k - 1);
      scale = newScale;
      clampPan();
      applyTransform();

      if (scale > 1) {
        lbimg.classList.add('zoomed');
        lbimg.setAttribute('aria-label', `Zoomed to ${Math.round(scale*100)}%`);
      } else {
        lbimg.classList.remove('zoomed');
        lbimg.setAttribute('aria-label', 'Click to zoom');
      }

      if (Math.abs(scale - lastZoomLevel) > 0.3) {
        sendGA('image_zoom', {
          zoom_level: Math.round(scale*100),
          artwork_src: currentSrc
        });
        lastZoomLevel = scale;
      }
    }

    lbimg.addEventListener('click', (e) => {
      if (scale === 1) {
        zoomAt(e.clientX, e.clientY, 2.5);
      } else {
        resetZoom();
      }
    });

    lbimg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const step = e.deltaY < 0 ? 1.1 : 0.9;
      const next = Math.max(1, Math.min(5, scale * step));
      if (next !== scale) zoomAt(e.clientX, e.clientY, next);
    }, { passive: false });

    lbimg.addEventListener('pointerdown', (e) => {
      if (scale <= 1) return;
      dragging = true;
      activePointerId = e.pointerId;
      lbimg.setPointerCapture(activePointerId);
      startX = e.clientX;
      startY = e.clientY;
    });

    lbimg.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== activePointerId) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      startX = e.clientX;
      startY = e.clientY;
      tx += dx;
      ty += dy;
      clampPan();
      applyTransform();
    });

    function endPan(e){
      if (e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
    }

    lbimg.addEventListener('pointerup', endPan);
    lbimg.addEventListener('pointercancel', endPan);
    lbimg.addEventListener('lostpointercapture', () => { dragging = false; activePointerId = null; });

    lbimg.addEventListener('load', ()=> {
      resetZoom();
      lbimg.classList.remove('loading');
    });

    lbimg.addEventListener('loadstart', ()=> {
      lbimg.classList.add('loading');
    });

    function shuffleExceptFirst(container) {
      const arr = Array.from(container.querySelectorAll('img'));
      totalImages = arr.length;
      if (arr.length <= 2) return;
      const first = arr.shift();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      container.replaceChildren(first, ...arr);
    }

    const shuffleId = Date.now();
    sendGA('gallery_shuffle', { shuffle_id: shuffleId, page: 'main' });

    shuffleExceptFirst(gallery);

    const items = gallery.querySelectorAll('img');

    const imgObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          if (!img.dataset.viewed) {
            img.dataset.viewed = 'true';
            imgObserver.unobserve(img);
          }
        }
      });
    }, { rootMargin: '50px' });

    items.forEach((img, idx) => {
      if (img.complete) img.classList.add('lazy-loaded');
      img.addEventListener('load', () => img.classList.add('lazy-loaded'));
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', (img.alt || 'Artwork') + ' — open in viewer');
      imgObserver.observe(img);
    });

    let lastFocus = null;
    let current = 0;
    let openedAt = 0;
    let currentTitle = '';
    let currentSrc = '';

    function bestSrc(el) { return el.dataset.full || el.src; }

    function openLightbox(index) {
      const img = items[index];
      current = index;
      currentTitle = img.alt || 'untitled';
      currentSrc = bestSrc(img);

      lbimg.src = currentSrc;
      lbimg.alt = currentTitle;
      lbimg.setAttribute('aria-label', 'Click to zoom');

      lb.classList.add('open');
      lb.removeAttribute('aria-hidden');
      document.body.classList.add('noscroll');

      lastFocus = document.activeElement;
      setTimeout(() => closeBtn.focus(), 50);

      const counter = `${index + 1} of ${totalImages}`;
      lbTitle.textContent = `${currentTitle} (${counter})`;
      lbTitle.style.opacity = '1';
      setTimeout(() => { lbTitle.style.opacity = '0'; }, 7000);

      announcer.textContent = `Viewing ${currentTitle}, image ${index + 1} of ${totalImages}. Use arrow keys to navigate.`;

      // NEW: update URL with current artwork
      const url = new URL(window.location);
      url.searchParams.set('circle', currentSrc.split('/').pop());
      window.history.replaceState({}, '', url);

      openedAt = Date.now();

      sendGA('art_view', {
        artwork_title: currentTitle,
        artwork_src: currentSrc,
        position: index + 1,
        shuffle_id: shuffleId,
        page: 'main'
      });

      sendGA('view_item', {
        items: [{
          item_name: currentTitle,
          item_id: currentSrc,
          index: index
        }]
      });

      if (!hasShownTouchHint && 'ontouchstart' in window) {
        setTimeout(() => {
          touchHint.classList.add('show');
          setTimeout(() => {
            touchHint.classList.remove('show');
            hasShownTouchHint = true;
            storage.set('touchHintShown', 'true');
          }, 4000);
        }, 500);
      }
    }

    function closeLightbox() {
      const dwell = openedAt ? Math.max(0, Math.round((Date.now() - openedAt) / 1000)) : 0;

      if (openedAt) {
        sendGA('art_close', {
          artwork_title: currentTitle || 'unknown',
          artwork_src: currentSrc || 'unknown',
          dwell_time_seconds: dwell,
          max_zoom: Math.round(lastZoomLevel * 100),
          page: 'main'
        });
      }

      // NEW: remove artwork URL parameter
      const url = new URL(window.location);
      url.searchParams.delete('circle');
      window.history.replaceState({}, '', url);

      openedAt = 0;
      currentTitle = '';
      currentSrc = '';

      resetZoom();

      lb.classList.remove('open');
      lb.setAttribute('aria-hidden','true');
      document.body.classList.remove('noscroll');

      if (lastFocus) lastFocus.focus();
      announcer.textContent = '';
    }

    function navigateTo(idx) {
      openLightbox(idx);

      setTimeout(() => {
        announcer.textContent = `Now viewing ${items[idx].alt || 'untitled'}, image ${idx + 1} of ${totalImages}`;
      }, 100);
    }

    function showAt(i) {
      current = (i + totalImages) % totalImages;
      navigateTo(current);
    }

    items.forEach((img, idx) => {
      img.addEventListener('click', () => openLightbox(idx));

      img.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(idx);
        }
      });
    });

    closeBtn.addEventListener('click', closeLightbox);

    lb.addEventListener('click', (e) => {
      if (e.target === lb) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;

      if (e.key === 'Escape') closeLightbox();

      if (e.key === 'ArrowRight') {
        const next = (current + 1) % totalImages;
        showAt(next);

        sendGA('keyboard_navigation', {
          direction: 'next',
          position: next + 1,
          page: 'main'
        });
      }

      if (e.key === 'ArrowLeft') {
        const prev = (current - 1 + totalImages) % totalImages;
        showAt(prev);

        sendGA('keyboard_navigation', {
          direction: 'prev',
          position: prev + 1,
          page: 'main'
        });
      }
    });

    // NEW: open artwork directly from shared URL
    const params = new URLSearchParams(window.location.search);
    const target = params.get('circle');

    if (target) {
      const targetIndex = Array.from(items).findIndex(img =>
        img.src.includes(target)
      );

      if (targetIndex !== -1) {
        setTimeout(() => openLightbox(targetIndex), 300);
      }
    }

    const manifoldBtn = document.getElementById('manifoldBtn');

    if (manifoldBtn) {
      manifoldBtn.addEventListener('click', () => {
        sendGA('mint_click', {
          link: 'manifold_profile',
          location: 'main_floating_button'
        });
      });
    }
  });
</script>
</body>
</html>
